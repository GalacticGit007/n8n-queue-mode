apiVersion: v1
kind: Service
metadata:
  name: {{ include "n8n-platform.fullname" . }}
  labels:
    {{- include "n8n-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: main
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: main
