apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n-platform.fullname" . }}-worker
  labels:
    {{- include "n8n-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: n8n-worker
          image: {{ required "Set image.reference to an explicit n8n image reference" .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker", "--concurrency={{ .Values.worker.concurrency }}"]
          env:
            - name: EXECUTIONS_MODE
              value: {{ .Values.n8n.executionsMode | quote }}

            - name: GENERIC_TIMEZONE
              value: {{ .Values.n8n.timezone | quote }}

            - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
              value: "{{ .Values.n8n.offloadManualExecutionsToWorkers }}"

            - name: DB_TYPE
              value: postgresdb

            - name: DB_POSTGRESDB_HOST
              value: {{ .Values.n8n.database.host | quote }}

            - name: DB_POSTGRESDB_PORT
              value: {{ .Values.n8n.database.port | quote }}

            - name: DB_POSTGRESDB_DATABASE
              value: {{ .Values.n8n.database.name | quote }}

            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.databaseUsername }}

            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.databasePassword }}

            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.encryptionKey }}

            - name: N8N_RUNNERS_MODE
              value: "{{ .Values.n8n.taskRunner.mode }}"

            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-runner-credentials
                  key: auth-token

            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: "0.0.0.0"

            - name: QUEUE_BULL_REDIS_HOST
              value: {{ .Values.n8n.redis.host | quote }}

            - name: QUEUE_BULL_REDIS_PORT
              value: {{ .Values.n8n.redis.port | quote }}

            - name: QUEUE_BULL_REDIS_DB
              value: {{ .Values.n8n.redis.database | quote }}

            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.redisPassword }}

            - name: QUEUE_BULL_REDIS_TLS
              value: {{ .Values.n8n.redis.tls | quote }}

            - name: DB_POSTGRESDB_SSL_ENABLED
              value: {{ .Values.n8n.database.sslEnabled | quote }}

          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}

        - name: n8n-task-runners
          image: "n8nio/runners@sha256:f2c942c0da6865e6961c1e65d9d7ea2c2417aa0119df8d96994b056cc423f60a"
          imagePullPolicy: IfNotPresent
          env:
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-runner-credentials
                  key: auth-token

            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: "http://127.0.0.1:5679"

            - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
              value: "15"

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
