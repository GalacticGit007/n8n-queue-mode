# Starter values. The image reference must point to an explicitly tested n8n image.
image:
  reference: "docker.n8n.io/n8nio/n8n@sha256:bcb4e4917141f4a5249c8eadf2776d347f4c2ede75adfbbc82064826af9a8ead"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

main:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

worker:
  replicaCount: 2
  concurrency: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

service:
  type: ClusterIP
  port: 5678

# Configure the actual ingress/TLS approach after the cluster environment is confirmed.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: n8n.lab.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

n8n:
  timezone: UTC
  # Lab: plain http behind Traefik. Move to https and set secureCookie: true later.
  host: n8n.lab.local
  protocol: http
  publicUrl: "http://n8n.lab.local"
  secureCookie: false
  executionsMode: queue
  offloadManualExecutionsToWorkers: true

  taskRunner:
    mode: external

  database:
    host: n8n-db-rw
    port: 5432
    name: n8n
    sslEnabled: false

  redis:
    host: redis
    port: 6379
    database: 0
    tls: false

# Secret objects must be created by the chosen secret-management workflow.
# Do not put secret values in this file or commit plaintext secrets to Git.
existingSecret: n8n-runtime-secrets
secretKeys:
  databaseUsername: db-username
  databasePassword: db-password
  encryptionKey: encryption-key
  redisPassword: redis-password

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
