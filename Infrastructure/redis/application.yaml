apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n-redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GalacticGit007/n8n-queue-mode.git
    targetRevision: main
    path: Infrastructure/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
