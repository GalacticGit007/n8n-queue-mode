apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db-restore
  namespace: default
  annotations:
    # Phase 1 only: unconfines the recovery Job container.
    # restore-db.sh swaps this for the "postgres" key once the Job completes.
    container.apparmor.security.beta.kubernetes.io/full-recovery: unconfined
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie
  enableSuperuserAccess: true
  storage:
    size: 5Gi
    storageClass: local-path
  bootstrap:
    recovery:
      source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: n8n-db-restore-s3
          serverName: n8n-db
